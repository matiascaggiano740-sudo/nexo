name: NEXO updater OTA end-to-end (emulator only)
# Uses an ephemeral localhost fixture; this workflow never creates a public release.

on:
  push:
    branches:
      - zapia/launcher-refresh
    paths:
      - app/build.gradle.kts
      - version.properties
      - app/src/main/AndroidManifest.xml
      - app/src/main/java/com/nexo/launcher/UpdateManager.kt
      - app/src/main/java/com/nexo/launcher/UpdateUi.kt
      - app/src/androidTest/java/com/nexo/launcher/OtaEndToEndTest.kt
      - scripts/run-ota-e2e.sh
      - .github/workflows/ota-e2e.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nexo-ota-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ota-e2e:
    name: Real updater UI flow against ephemeral in-emulator fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14.4

      - name: Enable KVM group permissions for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -e /dev/kvm

      - name: Prepare existing signing key for CI-only emulator builds
        env:
          NEXO_KEYSTORE_BASE64: ${{ secrets.NEXO_KEYSTORE_BASE64 }}
        run: printf '%s' "$NEXO_KEYSTORE_BASE64" | base64 --decode > nexo-release-final.p12

      - name: Build production-config candidate APK (never published)
        env:
          NEXO_STORE_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}
          NEXO_KEY_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          retry_gradle() {
            local attempt=1 status=0
            while (( attempt <= 5 )); do
              if gradle "$@" --no-daemon; then return 0; else status=$?; fi
              if (( attempt == 5 )); then break; fi
              sleep_seconds=$((20 * (2 ** (attempt - 1))))
              echo "Gradle download/build attempt $attempt failed (exit $status); retrying after ${sleep_seconds}s for transient repository rate limits."
              sleep "$sleep_seconds"
              attempt=$((attempt + 1))
            done
            return "$status"
          }
          retry_gradle assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          mkdir -p app/build/outputs/ota-fixtures app/src/androidTest/assets
          cp "$apk" app/build/outputs/ota-fixtures/ota-candidate-release.apk
          cp "$apk" app/src/androidTest/assets/ota-candidate.apk
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$aapt" dump badging "$apk" | sed -n '1p' | tee app/build/outputs/ota-fixtures/candidate-identity.txt
          "$apksigner" verify --print-certs "$apk" | tee app/build/outputs/ota-fixtures/candidate-signing.txt
          sha256sum "$apk" | tee app/build/outputs/ota-fixtures/candidate-sha256.txt
          grep -F "package: name='com.nexo.launcher' versionCode='1001' versionName='1.0.0'" app/build/outputs/ota-fixtures/candidate-identity.txt
          grep -F '058532948c51385e15884cb14dc6a916deb3bc8d42d170a1c70336467d99a463' app/build/outputs/ota-fixtures/candidate-signing.txt

      - name: Build lower-version CI-only target and instrumentation APK with existing certificate
        env:
          NEXO_STORE_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}
          NEXO_KEY_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          retry_gradle() {
            local attempt=1 status=0
            while (( attempt <= 5 )); do
              if gradle "$@" --no-daemon; then return 0; else status=$?; fi
              if (( attempt == 5 )); then break; fi
              sleep_seconds=$((20 * (2 ** (attempt - 1))))
              echo "Gradle download/build attempt $attempt failed (exit $status); retrying after ${sleep_seconds}s for transient repository rate limits."
              sleep "$sleep_seconds"
              attempt=$((attempt + 1))
            done
            return "$status"
          }
          endpoint='http://127.0.0.1:8765/repos/matiascaggiano740-sudo/nexo/releases/latest'
          retry_gradle assembleDebug assembleDebugAndroidTest \
            -Pnexo.test.versionCode=1000 \
            -Pnexo.test.updateApiUrl="$endpoint" \
            -Pnexo.test.allowCleartext=true \
            -Pnexo.test.allowLoopbackHttp=true \
            -Pnexo.test.signDebugWithRelease=true
          base_apk=app/build/outputs/ota-fixtures/nexo-test-base-v1000.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$base_apk"
          test_apk=app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s "$test_apk"
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$aapt" dump badging "$base_apk" | sed -n '1p' | tee app/build/outputs/ota-fixtures/base-identity.txt
          grep -F "package: name='com.nexo.launcher' versionCode='1000' versionName='1.0.0'" app/build/outputs/ota-fixtures/base-identity.txt
          "$apksigner" verify --print-certs "$base_apk" | tee app/build/outputs/ota-fixtures/base-signing.txt
          grep -F '058532948c51385e15884cb14dc6a916deb3bc8d42d170a1c70336467d99a463' app/build/outputs/ota-fixtures/base-signing.txt
          echo "CI-only versionCode 1000 base and instrumentation APK ready; both use the existing NEXO release certificate."

      - name: Run actual updater UI, local manifest/download, Android installer and post-upgrade assertions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 900
          script: /bin/bash scripts/run-ota-e2e.sh
        env:
          EXPECTED_CERT_SHA256: '058532948C51385E15884CB14DC6A916DEB3BC8D42D170A1C70336467D99A463'
          NEXO_STORE_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}
          NEXO_KEY_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}

      - name: Upload OTA test logs only (no APKs)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: NEXO-OTA-E2E-logs-${{ github.sha }}
          path: ota-e2e-artifacts/
          if-no-files-found: warn
          retention-days: 30
