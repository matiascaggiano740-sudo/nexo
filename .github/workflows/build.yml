name: Build NEXO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14.4

      - name: Preparar clave de firma
        env:
          NEXO_KEYSTORE_BASE64: ${{ secrets.NEXO_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$NEXO_KEYSTORE_BASE64" | base64 --decode > nexo-release-final.p12

      - name: Compilar APK firmado
        run: gradle assembleRelease --no-daemon
        env:
          NEXO_STORE_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}
          NEXO_KEY_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v6
        with:
          name: NEXO-apk
          path: app/build/outputs/apk/release/app-release.apk


