name: Build NEXO

on:
  push:
    branches:
      - zapia/launcher-refresh
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14.4

      - name: Preparar clave de firma
        env:
          NEXO_KEYSTORE_BASE64: ${{ secrets.NEXO_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$NEXO_KEYSTORE_BASE64" | base64 --decode > nexo-release-final.p12

      - name: Compilar APK firmado
        run: gradle assembleRelease --no-daemon
        env:
          NEXO_STORE_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}
          NEXO_KEY_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}

      - name: Validar sintaxis del script de diagnóstico
        run: bash -n scripts/diagnose-emulator.sh

      - name: Ejecutar pruebas instrumentadas en emulador Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/diagnose-emulator.sh
        env:
          NEXO_STORE_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}
          NEXO_KEY_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: NEXO-build-and-test-diagnostics
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/reports/androidTests/connected/debug/
            app/build/outputs/androidTest-results/connected/debug/
            app/build/diagnostics/
          if-no-files-found: warn

