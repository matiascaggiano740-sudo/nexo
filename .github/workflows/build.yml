name: Build NEXO

on:
  push:
    branches:
      - zapia/launcher-refresh
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: nexo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bash32-compat:
    name: Validate diagnostic script with macOS Bash 3.2
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6

      - name: Verify Bash 3.2 and syntax compatibility
        shell: bash
        run: |
          system_bash_version="$(/bin/bash -c 'printf "%s" "$BASH_VERSION"')"
          echo "macOS /bin/bash version: $system_bash_version"
          /bin/bash --version | head -n 1
          case "$system_bash_version" in
            3.2.*) ;;
            *) echo "ERROR: expected macOS Bash 3.2, got $system_bash_version" >&2; exit 1 ;;
          esac
          /bin/bash -n scripts/diagnose-emulator.sh
          if grep -En '(^|[;[:space:]])(local|declare)[[:space:]]+-[^[:space:]]*A|(^|[;[:space:]])(mapfile|readarray)([[:space:]]|$)' scripts/diagnose-emulator.sh; then
            echo "ERROR: Bash 4+ associative arrays or array-reading commands found." >&2
            exit 1
          fi
          echo "Bash 3.2 syntax and incompatible-construct checks passed."

  build:
    name: Build and instrumented emulator tests
    needs: bash32-compat
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -e /dev/kvm

      - name: Report actual Bash used by the test job
        run: |
          command -v bash
          bash --version
          /bin/bash --version

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14.4

      - name: Preparar clave de firma
        env:
          NEXO_KEYSTORE_BASE64: ${{ secrets.NEXO_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$NEXO_KEYSTORE_BASE64" | base64 --decode > nexo-release-final.p12

      - name: Ejecutar tests unitarios (reintentos por rate limit transitorio)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle testDebugUnitTest testReleaseUnitTest --no-daemon; then exit 0; else status=$?; fi
            echo "Intento $attempt falló con código $status; reintentando tras una espera breve."
            sleep $((attempt * 10))
          done
          exit 1
        env:
          NEXO_STORE_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}
          NEXO_KEY_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}

      - name: Validar sintaxis del script de diagnóstico
        run: /bin/bash -n scripts/diagnose-emulator.sh

      - name: Preparar solo paquetes faltantes del Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"

          sdk_roots=()
          [[ -n "${ANDROID_HOME:-}" ]] && sdk_roots+=("$ANDROID_HOME")
          if [[ -n "${ANDROID_SDK_ROOT:-}" && "${ANDROID_SDK_ROOT}" != "${ANDROID_HOME:-}" ]]; then
            sdk_roots+=("$ANDROID_SDK_ROOT")
          fi
          if [[ ${#sdk_roots[@]} -eq 0 ]]; then
            echo "ERROR: ANDROID_HOME y ANDROID_SDK_ROOT están vacías; no se puede localizar el Android SDK." >&2
            exit 1
          fi

          inspected_paths=()
          sdkmanager_path=""
          sdk_root=""
          for candidate_root in "${sdk_roots[@]}"; do
            echo "Inspeccionando raíz SDK: $candidate_root"
            if [[ ! -d "$candidate_root" ]]; then
              echo "No existe el directorio SDK: $candidate_root"
              continue
            fi
            for candidate in "$candidate_root"/cmdline-tools/*/bin/sdkmanager; do
              [[ -e "$candidate" ]] || continue
              inspected_paths+=("$candidate")
              if [[ -f "$candidate" && -x "$candidate" ]]; then
                sdkmanager_path="$candidate"
                sdk_root="$candidate_root"
                break 2
              fi
            done
          done

          if [[ -z "$sdkmanager_path" ]]; then
            echo "ERROR: no se encontró un sdkmanager ejecutable dentro de cmdline-tools." >&2
            echo "Rutas inspeccionadas:" >&2
            if [[ ${#inspected_paths[@]} -eq 0 ]]; then
              for candidate_root in "${sdk_roots[@]}"; do
                echo "  $candidate_root/cmdline-tools/*/bin/sdkmanager (sin coincidencias)" >&2
              done
            else
              printf '  %s\n' "${inspected_paths[@]}" >&2
              for inspected in "${inspected_paths[@]}"; do
                if [[ ! -f "$inspected" ]]; then echo "    no es archivo regular" >&2; fi
                if [[ ! -x "$inspected" ]]; then echo "    no tiene permiso de ejecución" >&2; fi
              done
            fi
            exit 1
          fi
          echo "sdkmanager localizado: $sdkmanager_path"
          echo "SDK seleccionado: $sdk_root"

          missing_packages=()
          [[ -x "$sdk_root/platform-tools/adb" ]] || missing_packages+=("platform-tools")
          [[ -f "$sdk_root/platforms/android-35/android.jar" ]] || missing_packages+=("platforms;android-35")
          [[ -x "$sdk_root/emulator/emulator" ]] || missing_packages+=("emulator")
          [[ -f "$sdk_root/system-images/android-35/google_apis/x86_64/system.img" ]] || missing_packages+=("system-images;android-35;google_apis;x86_64")

          if [[ ${#missing_packages[@]} -eq 0 ]]; then
            echo "Paquetes requeridos del emulador Android 35 ya instalados; no se instala nada."
          else
            printf 'Se instalarán únicamente estos paquetes faltantes: %s\n' "${missing_packages[*]}"
            set +o pipefail
            yes | "$sdkmanager_path" --licenses > /dev/null
            license_status=${PIPESTATUS[1]}
            set -o pipefail
            if [[ $license_status -ne 0 ]]; then
              echo "ERROR: sdkmanager --licenses terminó con código $license_status." >&2
              exit "$license_status"
            fi
            "$sdkmanager_path" --install "${missing_packages[@]}"
          fi

      - name: Ejecutar pruebas instrumentadas en emulador Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: /bin/bash scripts/diagnose-emulator.sh
        env:
          NEXO_STORE_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}
          NEXO_KEY_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}

      - name: Construir Release solo después de aprobar toda la suite instrumentada
        run: gradle assembleRelease --no-daemon
        env:
          NEXO_STORE_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}
          NEXO_KEY_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}

      - name: Descargar el APK Release histórico firmado (run de base aprobado)
        uses: actions/download-artifact@v6
        with:
          name: NEXO-build-and-test-diagnostics
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 45413173460
          path: historical-artifact

      - name: Verificar identidad y certificado permanente del Release
        shell: bash
        env:
          EXPECTED_CERT_SHA256: '058532948C51385E15884CB14DC6A916DEB3BC8D42D170A1C70336467D99A463'
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          version_code=$(sed -n 's/^VERSION_CODE=//p' version.properties)
          version_name=$(sed -n 's/^VERSION_NAME=//p' version.properties)
          badging=$("$aapt" dump badging "$apk" | sed -n '1p')
          echo "$badging" | grep -F "package: name='com.nexo.launcher' versionCode='$version_code' versionName='$version_name'"
          "$apksigner" verify --verbose "$apk"
          signer=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$signer" = "$EXPECTED_CERT_SHA256" || { echo 'Release certificate mismatch; do not distribute this APK.' >&2; exit 1; }

      - name: Probar actualización firmada y persistencia en emulador desde APK histórico
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/test-signed-upgrade.sh
        env:
          EXPECTED_CERT_SHA256: '058532948C51385E15884CB14DC6A916DEB3BC8D42D170A1C70336467D99A463'
          NEXO_STORE_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}
          NEXO_KEY_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: NEXO-build-and-test-diagnostics
          path: |
            app/build/reports/androidTests/connected/debug/
            app/build/outputs/androidTest-results/connected/debug/
            app/build/diagnostics/
          if-no-files-found: warn
