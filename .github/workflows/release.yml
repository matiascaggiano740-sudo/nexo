name: NEXO signed release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag and version properties
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version_code=$(sed -n 's/^VERSION_CODE=//p' version.properties)
          version_name=$(sed -n 's/^VERSION_NAME=//p' version.properties)
          test -n "$version_code" && test -n "$version_name"
          test "$GITHUB_REF_NAME" = "v$version_name"
          git fetch origin zapia/launcher-refresh --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || { echo 'Release tag must point to a commit reachable from zapia/launcher-refresh.' >&2; exit 1; }
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$version_name" >> "$GITHUB_ENV"

      - name: Download exact tested signed candidate from green CI run
        uses: actions/download-artifact@v6
        with:
          name: NEXO-Release-candidate-73a00e5ebfa7c1b47a0452ce72e0c2afdf32fe08
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 46089545309
          path: candidate

      - name: Verify CI evidence, candidate hash, package, version and permanent signing certificate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CERT_SHA256: '058532948C51385E15884CB14DC6A916DEB3BC8D42D170A1C70336467D99A463'
          EXPECTED_TESTED_COMMIT: '73a00e5ebfa7c1b47a0452ce72e0c2afdf32fe08'
        run: |
          set -euo pipefail
          test "$(gh api repos/matiascaggiano740-sudo/nexo/actions/runs/46089545309 --jq '.conclusion')" = success
          test -s candidate/app-release.apk
          grep -Fx "source_commit=$EXPECTED_TESTED_COMMIT" candidate/metadata.txt
          grep -Fx 'applicationId=com.nexo.launcher' candidate/metadata.txt
          grep -Fx "versionCode=$VERSION_CODE" candidate/metadata.txt
          grep -Fx "versionName=$VERSION_NAME" candidate/metadata.txt
          grep -Fx "signing_certificate_sha256=$EXPECTED_CERT_SHA256" candidate/metadata.txt
          expected_hash=$(sed -n 's/^apk_sha256=//p' candidate/metadata.txt)
          actual_hash=$(sha256sum candidate/app-release.apk | awk '{print toupper($1)}')
          test "$actual_hash" = "$expected_hash"
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          badging=$("$aapt" dump badging candidate/app-release.apk | sed -n '1p')
          echo "$badging" | grep -F "package: name='com.nexo.launcher' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"
          "$apksigner" verify --verbose candidate/app-release.apk
          signer=$("$apksigner" verify --print-certs candidate/app-release.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$signer" = "$EXPECTED_CERT_SHA256"
          printf '%s\n' "$badging" > candidate/verified-aapt-badging.txt
          printf 'Verified SHA-256: %s\nVerified certificate: %s\n' "$actual_hash" "$signer" | tee candidate/publication-verification.txt

      - name: Create update manifest for the verified candidate
        shell: bash
        env:
          EXPECTED_CERT_SHA256: '058532948C51385E15884CB14DC6A916DEB3BC8D42D170A1C70336467D99A463'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib
          props = dict(line.strip().split('=',1) for line in pathlib.Path('version.properties').read_text().splitlines() if '=' in line and not line.lstrip().startswith('#'))
          apk = pathlib.Path('candidate/app-release.apk')
          digest = hashlib.sha256(apk.read_bytes()).hexdigest().upper()
          name = os.environ['VERSION_NAME']; code = int(os.environ['VERSION_CODE']); tag = os.environ['GITHUB_REF_NAME']
          metadata = pathlib.Path('candidate/metadata.txt').read_text()
          assert props['VERSION_NAME'] == name and int(props['VERSION_CODE']) == code
          assert f'apk_sha256={digest}' in metadata
          notes = pathlib.Path('RELEASE_NOTES.md').read_text().strip()
          manifest = {
              'applicationId': 'com.nexo.launcher', 'versionCode': code, 'versionName': name,
              'publishedAt': datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
              'changelog': notes,
              'apkUrl': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/app-release.apk",
              'sha256': digest, 'signingCertificateSha256': os.environ['EXPECTED_CERT_SHA256']
          }
          pathlib.Path('nexo-update.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          print(f"version={name} versionCode={code} sha256={digest} signing={os.environ['EXPECTED_CERT_SHA256']}")
          PY

      - name: Publish the exact CI-tested signed APK and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" candidate/app-release.apk nexo-update.json --title "NEXO $VERSION_NAME" --notes-file RELEASE_NOTES.md
