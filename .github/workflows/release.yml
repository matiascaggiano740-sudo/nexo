name: NEXO signed release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14.4
      - name: Validate release tag and version properties
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_code=$(sed -n 's/^VERSION_CODE=//p' version.properties)
          version_name=$(sed -n 's/^VERSION_NAME=//p' version.properties)
          test -n "$version_code" && test -n "$version_name"
          test "$GITHUB_REF_NAME" = "v$version_name"
          git fetch origin zapia/launcher-refresh --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || { echo 'Release tag must point to a commit reachable from zapia/launcher-refresh.' >&2; exit 1; }
          latest_manifest=$(gh api repos/matiascaggiano740-sudo/nexo/releases/latest --jq '.assets[] | select(.name == "nexo-update.json") | .browser_download_url' 2>/dev/null || true)
          if [[ -n "$latest_manifest" ]]; then
            previous_code=$(curl --fail --silent --show-error "$latest_manifest" | python3 -c 'import json,sys; print(json.load(sys.stdin)["versionCode"])')
            test "$version_code" -gt "$previous_code" || { echo "VERSION_CODE must increase beyond previous release $previous_code." >&2; exit 1; }
          fi
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$version_name" >> "$GITHUB_ENV"
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
      - name: Prepare permanent signing key
        env:
          NEXO_KEYSTORE_BASE64: ${{ secrets.NEXO_KEYSTORE_BASE64 }}
        run: printf '%s' "$NEXO_KEYSTORE_BASE64" | base64 --decode > nexo-release-final.p12
      - name: Run unit tests and compile Debug plus instrumented tests
        run: gradle testDebugUnitTest assembleDebug compileDebugAndroidTestKotlin --no-daemon
        env:
          NEXO_STORE_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}
          NEXO_KEY_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}
      - name: Run complete instrumented suite on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle connectedDebugAndroidTest --no-daemon
      - name: Build signed Release only after the complete suite passes
        env:
          NEXO_STORE_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}
          NEXO_KEY_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Download the historical signed Release APK from the approved baseline run
        uses: actions/download-artifact@v6
        with:
          name: NEXO-build-and-test-diagnostics
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 45413173460
          path: historical-artifact
      - name: Verify APK identity and permanent signing certificate; prepare manifest
        shell: bash
        env:
          EXPECTED_CERT_SHA256: '058532948C51385E15884CB14DC6A916DEB3BC8D42D170A1C70336467D99A463'
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          badging=$("$aapt" dump badging "$apk" | sed -n '1p')
          echo "$badging" | grep -F "package: name='com.nexo.launcher' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"
          "$apksigner" verify --verbose "$apk"
          signer=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$signer" = "$EXPECTED_CERT_SHA256" || { echo 'Release certificate does not match the permanent NEXO certificate.' >&2; exit 1; }
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib
          props = dict(line.strip().split('=',1) for line in pathlib.Path('version.properties').read_text().splitlines() if '=' in line and not line.lstrip().startswith('#'))
          apk = pathlib.Path('app/build/outputs/apk/release/app-release.apk')
          digest = hashlib.sha256(apk.read_bytes()).hexdigest().upper()
          name = os.environ['VERSION_NAME']; code = int(os.environ['VERSION_CODE']); tag = os.environ['GITHUB_REF_NAME']
          assert props['VERSION_NAME'] == name and int(props['VERSION_CODE']) == code
          notes = pathlib.Path('RELEASE_NOTES.md').read_text().strip()
          manifest = {
              'applicationId': 'com.nexo.launcher', 'versionCode': code, 'versionName': name,
              'publishedAt': datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'), 'changelog': notes,
              'apkUrl': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/app-release.apk",
              'sha256': digest, 'signingCertificateSha256': os.environ['EXPECTED_CERT_SHA256']
          }
          pathlib.Path('nexo-update.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          print(f"version={name} versionCode={code} sha256={digest} signing={os.environ['EXPECTED_CERT_SHA256']}")
          PY
      - name: Test signed in-place upgrade and user-data preservation on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            old_apk=$(find historical-artifact -path '*/outputs/apk/release/app-release.apk' -type f | head -n 1)
            new_apk=app/build/outputs/apk/release/app-release.apk
            test -s "$old_apk" && test -s "$new_apk"
            apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
            old_cert=$("$apksigner" verify --print-certs "$old_apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            new_cert=$("$apksigner" verify --print-certs "$new_apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            test "$old_cert" = "$EXPECTED_CERT_SHA256" && test "$new_cert" = "$EXPECTED_CERT_SHA256"
            adb install "$old_apk"
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            seed_result=$(adb shell am instrument -w -e class com.nexo.launcher.UpgradePersistenceTest#seedUserDataBeforeUpgrade com.nexo.launcher.test/androidx.test.runner.AndroidJUnitRunner 2>&1)
            printf '%s\n' "$seed_result"
            echo "$seed_result" | grep -Fq 'OK (1 test)'
            adb install -r "$new_apk"
            upgrade_result=$(adb shell am instrument -w -e class com.nexo.launcher.UpgradePersistenceTest#updatedPackageKeepsUserDataAndHasNewVersion com.nexo.launcher.test/androidx.test.runner.AndroidJUnitRunner 2>&1)
            printf '%s\n' "$upgrade_result"
            echo "$upgrade_result" | grep -Fq 'OK (1 test)'
        env:
          EXPECTED_CERT_SHA256: '058532948C51385E15884CB14DC6A916DEB3BC8D42D170A1C70336467D99A463'
      - name: Publish signed APK and stable update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk nexo-update.json --title "NEXO $VERSION_NAME" --notes-file RELEASE_NOTES.md
